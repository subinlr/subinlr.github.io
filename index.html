<script>
  (function () {
    // Find the Time Pass / Chaos container and buttons
    const findFunElements = () => {
      const selectors = [
        "#chaosPanel",
        "#timePassPanel",
        "#funZone",
        ".chaos-container",
        ".timepass-card"
      ];
      const found = [];
      selectors.forEach((sel) => {
        document.querySelectorAll(sel).forEach((el) => found.push(el));
      });

      // Also match any card/section containing "TIME PASS" or "DO NOT PRESS"
      document.querySelectorAll("section, div.glass-panel, div.hud-card").forEach((el) => {
        if (
          el.innerText &&
          (el.innerText.includes("TIME PASS") || el.innerText.includes("DO NOT PRESS")) &&
          !el.querySelector("#searchForm")
        ) {
          found.push(el);
        }
      });
      return [...new Set(found)];
    };

    // Create a sleek floating toggle pill in the bottom-left corner
    const toggleBtn = document.createElement("button");
    toggleBtn.id = "funModeMasterToggle";
    Object.assign(toggleBtn.style, {
      position: "fixed",
      bottom: "18px",
      left: "18px",
      zIndex: "999999",
      padding: "8px 14px",
      borderRadius: "999px",
      border: "1px solid rgba(255, 255, 255, 0.15)",
      background: "rgba(10, 12, 24, 0.85)",
      backdropFilter: "blur(10px)",
      color: "#a5b4fc",
      fontFamily: "monospace",
      fontSize: "12px",
      fontWeight: "600",
      cursor: "pointer",
      boxShadow: "0 4px 15px rgba(0,0,0,0.4)",
      transition: "all 0.25s ease"
    });

    let funEnabled = localStorage.getItem("nexus_fun_mode") !== "off";

    function applyFunState() {
      const els = findFunElements();
      els.forEach((el) => {
        el.style.display = funEnabled ? "" : "none";
      });

      // Reset any active body transforms/rotations when turning off
      if (!funEnabled) {
        document.body.style.transform = "none";
        document.body.style.animation = "none";
        const bossModal = document.getElementById("bossModal") || document.getElementById("bossOverlay");
        if (bossModal) bossModal.style.display = "none";
      }

      toggleBtn.textContent = funEnabled ? "🎮 Fun Mode: ON" : "🔒 Fun Mode: OFF";
      toggleBtn.style.opacity = funEnabled ? "0.9" : "0.5";
      localStorage.setItem("nexus_fun_mode", funEnabled ? "on" : "off");
    }

    toggleBtn.addEventListener("click", () => {
      funEnabled = !funEnabled;
      applyFunState();
    });

    // Shortcut: Alt + F to toggle Fun Mode anytime
    window.addEventListener("keydown", (e) => {
      if (e.altKey && e.key.toLowerCase() === "f") {
        e.preventDefault();
        funEnabled = !funEnabled;
        applyFunState();
      }
    });

    document.body.appendChild(toggleBtn);
    window.addEventListener("DOMContentLoaded", applyFunState);
    setTimeout(applyFunState, 100);
  })();
</script>
