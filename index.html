<script>
  (function () {
    let bugsAllowed = false;
    const gameIntervals = new Set();
    const bugEmojis = ["👾", "🦆", "🐛", "🛸", "🦟", "🐞", "🕷️", "🦂", "🎯"];

    // 1. Intercept setInterval to catch and control any bug/duck spawner loops
    const origSetInterval = window.setInterval;
    window.setInterval = function (fn, delay, ...args) {
      const fnStr = fn ? fn.toString().toLowerCase() : "";
      const isGameTimer =
        fnStr.includes("bug") ||
        fnStr.includes("duck") ||
        fnStr.includes("spawn") ||
        fnStr.includes("target") ||
        fnStr.includes("critter") ||
        fnStr.includes("arcade") ||
        fnStr.includes("enemy");

      const id = origSetInterval.call(window, function (...cbArgs) {
        if (isGameTimer && !bugsAllowed) {
          window.clearInterval(id);
          gameIntervals.delete(id);
          return;
        }
        return fn.apply(this, cbArgs);
      }, delay, ...args);

      if (isGameTimer) {
        gameIntervals.add(id);
        bugsAllowed = true;
        updateKillBtn();
      }
      return id;
    };

    // 2. Check if a DOM element is a flying bug, duck, or laser effect
    function isBugElement(el) {
      if (!el || !el.tagName || el.id === "bugKillSwitchBtn") return false;
      if (["BODY", "HTML", "MAIN", "HEADER", "SECTION", "FORM"].includes(el.tagName)) return false;
      if (el.querySelector && (el.querySelector("#searchForm") || el.querySelector("input"))) return false;

      const clsAndId = ((el.className || "") + " " + (el.id || "")).toLowerCase();
      if (
        clsAndId.includes("bug") ||
        clsAndId.includes("duck") ||
        clsAndId.includes("critter") ||
        clsAndId.includes("arcade-target") ||
        clsAndId.includes("laser") ||
        clsAndId.includes("flying") ||
        clsAndId.includes("enemy")
      ) {
        // Don't delete the control button itself inside the dashboard panel
        if (el.tagName === "BUTTON" && el.closest("section, .glass-panel, .hud-card")) return false;
        return true;
      }

      // Check for standalone floating emoji targets attached to body
      if (el.parentElement === document.body && el.innerText && el.innerText.length <= 6) {
        if (bugEmojis.some((emoji) => el.innerText.includes(emoji))) {
          return true;
        }
      }
      return false;
    }

    // 3. Hard wipe all active bugs, timers, and screen animations
    function killAllBugs() {
      bugsAllowed = false;

      // Clear all tracked game intervals
      gameIntervals.forEach((id) => window.clearInterval(id));
      gameIntervals.clear();

      // Remove all existing bug/duck elements from the screen
      document.querySelectorAll("body *").forEach((el) => {
        if (isBugElement(el)) {
          el.remove();
        }
      });

      // Reset any screen spin/shake animations
      document.body.style.transform = "none";
      document.body.style.animation = "none";

      updateKillBtn();
    }

    // 4. Auto-block any runaway bug element from appearing when Bugs are OFF
    const observer = new MutationObserver((mutations) => {
      if (bugsAllowed) return;
      mutations.forEach((m) => {
        m.addedNodes.forEach((node) => {
          if (node.nodeType === 1 && isBugElement(node)) {
            node.remove();
          }
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 5. Floating Kill-Switch Button (Bottom-Left)
    const killBtn = document.createElement("button");
    killBtn.id = "bugKillSwitchBtn";
    Object.assign(killBtn.style, {
      position: "fixed",
      bottom: "18px",
      left: "18px",
      zIndex: "9999999",
      padding: "8px 14px",
      borderRadius: "999px",
      border: "1px solid rgba(255, 80, 80, 0.4)",
      background: "rgba(15, 15, 28, 0.9)",
      backdropFilter: "blur(10px)",
      color: "#ff8080",
      fontFamily: "monospace",
      fontSize: "12px",
      fontWeight: "700",
      cursor: "pointer",
      boxShadow: "0 4px 15px rgba(0,0,0,0.5)",
      transition: "all 0.2s ease"
    });

    function updateKillBtn() {
      if (bugsAllowed) {
        killBtn.textContent = "🛑 Stop Bugs (Esc)";
        killBtn.style.borderColor = "rgba(255, 80, 80, 0.8)";
        killBtn.style.color = "#ff4d4d";
      } else {
        killBtn.textContent = "✅ Bugs: KILLED";
        killBtn.style.borderColor = "rgba(51, 255, 204, 0.3)";
        killBtn.style.color = "#33ffcc";
      }
    }

    killBtn.addEventListener("click", () => {
      killAllBugs();
    });

    // Also stop everything immediately when pressing Escape
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        killAllBugs();
      }
    });

    document.body.appendChild(killBtn);
    updateKillBtn();
  })();
</script>
